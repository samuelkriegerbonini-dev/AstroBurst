name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag against the version fields and build the release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" release-notes.md
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AstroBurst ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: pnpm install
      - name: Fetch the bundled Tycho-2 catalogue with its pinned size and SHA-256
        run: node scripts/fetch-tier0.mjs
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || format('--target {0}', matrix.target) }}
      - name: Collect the copyright files of the Ubuntu packages the AppImage takes files from
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          shopt -s nullglob
          IMAGES=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          if [ ${#IMAGES[@]} -ne 1 ]; then echo "expected one AppImage, found ${#IMAGES[@]}"; exit 1; fi
          chmod +x "${IMAGES[0]}"
          rm -rf squashfs-root appimage-libraries
          "${IMAGES[0]}" --appimage-extract > /dev/null
          node scripts/appimage-licences.mjs collect squashfs-root appimage-libraries --skip usr/bin/astroburst --skip usr/lib/AstroBurst
          rm -rf squashfs-root
      - name: Rebuild the AppImage with those copyright files inside and check it
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          pnpm tauri bundle --bundles appimage --target x86_64-unknown-linux-gnu --config '{"bundle":{"resources":{"../appimage-libraries/":"licenses/appimage-libraries/"}}}'
          shopt -s nullglob
          IMAGES=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          if [ ${#IMAGES[@]} -ne 1 ]; then echo "expected one AppImage, found ${#IMAGES[@]}"; exit 1; fi
          chmod +x "${IMAGES[0]}"
          "${IMAGES[0]}" --appimage-extract > /dev/null
          node scripts/appimage-licences.mjs check squashfs-root usr/lib/AstroBurst/licenses/appimage-libraries --skip usr/bin/astroburst --skip usr/lib/AstroBurst
          rm -rf squashfs-root
      - name: Create Linux tarball
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          BIN=src-tauri/target/x86_64-unknown-linux-gnu/release/astroburst
          if [ ! -x "$BIN" ]; then echo "$BIN is missing"; exit 1; fi
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p astroburst-${VERSION}/bin astroburst-${VERSION}/lib/AstroBurst astroburst-${VERSION}/data
          cp "$BIN" astroburst-${VERSION}/bin/
          cp -r src-tauri/licenses astroburst-${VERSION}/
          cp -r src-tauri/resources/catalogs astroburst-${VERSION}/lib/AstroBurst/
          cp data/* astroburst-${VERSION}/data/
          node scripts/fetch-tier0.mjs --verify astroburst-${VERSION}/lib/AstroBurst/catalogs
          tar czf astroburst-${VERSION}-linux-x86_64.tar.gz astroburst-${VERSION}
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            astroburst-*-linux-x86_64.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
