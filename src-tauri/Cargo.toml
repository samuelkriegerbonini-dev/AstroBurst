[package]
name = "astroburst"
version = "0.5.5"
edition = "2021"
description = "AstroBurst -- High-Performance JWST FITS Processing"
license = "GPL-3.0-or-later"
authors = ["Samuel Krieger Bonini"]
repository = "https://github.com/samuelkriegerbonini-dev/AstroBurst"

[dependencies]
tauri = { version = "2.10", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2.6.0", optional = true }
tauri-plugin-fs = { version = "2.2.0", optional = true }
tauri-plugin-shell = { version = "2.3", optional = true }
tauri-plugin-opener = { version = "2.3", optional = true }

# Headless server (Axum) deps — contributed by Jae-Joon Lee (https://github.com/leejjoon).
axum = { version = "0.7", optional = true }
tower = { version = "0.4", features = ["util"], optional = true }
env_logger = { version = "0.11", optional = true }
tower-http = { version = "0.5", features = ["request-id", "trace", "util"], optional = true }
dashmap = { version = "6", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }

tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "2.0"

ndarray = { version = "0.16", features = ["rayon", "serde"] }
rayon = "1.10"
rand = "0.8"
image = "0.25"
rustfft = "6.2"
num-complex = "0.4"

memmap2 = "0.9"
flate2 = "1.0"
zip = "2"
tempfile = "3.8"
dirs = "5.0"
regex = "1.10"

bzip2 = { version = "0.5", optional = true }
lz4_flex = { version = "0.11", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart"], optional = true}
base64 = "0.22.1"
log = "0.4.29"
config = "0.15.22"
urlencoding = "2.1.3"

[features]
default = ["tauri", "astrometry-net", "asdf-full", "vizier"]
tauri = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:tauri-plugin-shell", "dep:tauri-plugin-opener"]
# Headless HTTP server — contributed by Jae-Joon Lee (https://github.com/leejjoon).
# Build: cargo build --no-default-features --features server,astrometry-net,asdf-full,vizier
server = ["dep:axum", "dep:tower", "dep:tower-http", "dep:dashmap", "dep:uuid", "dep:tokio-stream", "dep:tokio-util", "dep:env_logger"]
astrometry-net = ["dep:reqwest"]
vizier = ["reqwest/blocking"]
asdf-full = ["dep:bzip2", "dep:lz4_flex"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[lib]
name = "astroburst_lib"
crate-type = ["lib"]

[[bin]]
name = "astroburst"
path = "src/main.rs"
required-features = ["tauri"]

# Headless server binary — contributed by Jae-Joon Lee (https://github.com/leejjoon).
[[bin]]
name = "astroburst-server"
path = "src/server/main.rs"
required-features = ["server"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
