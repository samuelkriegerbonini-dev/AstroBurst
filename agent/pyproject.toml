# Contributed by Jae-Joon Lee — https://github.com/leejjoon
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astroburst-client"
version = "0.1.0"
description = "Async Python client for the astroburst-server REST API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
image = ["Pillow>=10"]
dev = ["pyflakes", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["astroburst_client"]